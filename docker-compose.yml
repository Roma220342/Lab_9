# ЛР 9: Neo4j 5 Enterprise (evaluation) + Graph Data Science.
# Enterprise потрібен лише для ролі лише-для-читання (CREATE ROLE / GRANT) у результаті 5.
services:
  neo4j:
    image: neo4j:5.26-enterprise
    container_name: lab09-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # Bolt (Python-драйвер)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-lab09-password}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - ./data:/import          # CSV для LOAD CSV 'file:///...'
      - lab09-data:/data
volumes:
  lab09-data:
